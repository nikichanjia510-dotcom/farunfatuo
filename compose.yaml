services:
  tuobao:
    build:
      context: .
    image: tuobao-legal-care:local
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/tuobao.sqlite
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-demo-token-change-me}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-8000}
    volumes:
      - tuobao_data:/app/data
    restart: unless-stopped

volumes:
  tuobao_data:
