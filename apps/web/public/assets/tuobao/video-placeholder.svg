  <circle cx="1060" cy="130" r="74" fill="#ffd65e" opacity=".9"/>
  <path d="M0 532c177-75 358-75 543 0s370 75 555 0c71-29 132-34 182-15v203H0V532Z" fill="#7dcbb4"/>
